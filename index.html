<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NomadicKings — Travel Mongolia</title>
  <meta name="description" content="NomadicKings: Mongolia tours, drivers, guides, camps, custom itineraries." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css" />
</head>
<body>

  <!-- ═══════════════════════════════════════════════════════
       Sections are loaded dynamically from /sections/ folder.
       Each section lives in its own HTML file for easy editing.
       ═══════════════════════════════════════════════════════ -->
  <div id="s-topbar"></div>
  <div id="s-header"></div>
  <div id="s-progress"></div>
  <div id="s-hero"></div>
  <div id="s-destinations"></div>
  <div id="s-provinces"></div>
  <div id="s-packages"></div>
  <div id="s-services"></div>
  <div id="s-reviews"></div>
  <div id="s-faq"></div>
  <div id="s-contact"></div>
  <div id="s-footer"></div>
  <div id="s-widgets"></div>

  <script>
    const SECTIONS = [
      { id: "s-topbar",       file: "sections/topbar.html"       },
      { id: "s-header",       file: "sections/header.html"       },
      { id: "s-progress",     file: "sections/progress.html"     },
      { id: "s-hero",         file: "sections/hero.html"         },
      { id: "s-destinations", file: "sections/destinations.html" },
      { id: "s-provinces",    file: "sections/provinces.html"    },
      { id: "s-packages",     file: "sections/packages.html"     },
      { id: "s-services",     file: "sections/services.html"     },
      { id: "s-reviews",      file: "sections/reviews.html"      },
      { id: "s-faq",          file: "sections/faq.html"          },
      { id: "s-contact",      file: "sections/contact.html"      },
      { id: "s-footer",       file: "sections/footer.html"       },
      { id: "s-widgets",      file: "sections/widgets.html"      },
    ];

    Promise.all(
      SECTIONS.map(({ id, file }) =>
        fetch(file)
          .then(r => {
            if (!r.ok) throw new Error("Failed to load " + file + ": " + r.status);
            return r.text();
          })
          .then(html => { document.getElementById(id).innerHTML = html; })
          .catch(err => {
            console.error(err);
            document.getElementById(id).innerHTML =
              "<p style='color:red;padding:1rem;'>Could not load <b>" + file + "</b></p>";
          })
      )
    ).then(() => {
      const s = document.createElement("script");
      s.src = "index.js";
      document.body.appendChild(s);
    });
  </script>
</body>
</html>
