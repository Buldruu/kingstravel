<section class="hero hero-photo" id="hero">
  <div class="hero-overlay"></div>
  <div class="container hero-grid">
    <div class="hero-copy reveal">
      <div class="hero-eyebrow">
        <span class="eyebrow-dot"></span>
        <span data-i18n="hero.eyebrow">Explore the Land of Eternal Blue Sky</span>
      </div>
      <h1 data-i18n="hero.h1">Your Trusted Way to Explore Mongolia.</h1>
      <p class="lead" data-i18n="hero.lead">
        Gobi, Khuvsgul, Altai, Terelj, Kharkhorin — private tours, drivers, guides, camps, and custom routes.
      </p>
      <div class="hero-actions">
        <a class="btn" href="#packages" data-i18n="hero.cta1">Explore packages</a>
        <a class="btn btn-ghost" href="#services" data-i18n="hero.cta2">See services</a>
      </div>
      <div class="hero-stats">
        <div class="stat">
          <div class="stat-num">100+</div>
          <div class="stat-label" data-i18n="hero.stat1">Routes</div>
        </div>
        <div class="stat">
          <div class="stat-num">21</div>
          <div class="stat-label" data-i18n="hero.stat2">Provinces</div>
        </div>
        <div class="stat">
          <div class="stat-num">24–48h</div>
          <div class="stat-label" data-i18n="hero.stat3">Reply time</div>
        </div>
      </div>
    </div>
  </div>
  <div class="hero-slider" aria-label="Hero image slider">
    <button class="hs-btn" id="hsPrev" aria-label="Previous image" type="button">‹</button>
    <div class="hs-dots" id="hsDots"></div>
    <button class="hs-btn" id="hsNext" aria-label="Next image" type="button">›</button>
  </div>
  <div class="hero-scroll-hint">
    <span data-i18n="hero.scroll">Scroll to explore</span>
    <div class="scroll-line"></div>
  </div>
</section>
