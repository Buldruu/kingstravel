<section class="section" id="packages">
  <div class="container">
    <div class="section-head reveal">
      <div class="section-label" data-i18n="pkg.label">Curated Journeys</div>
      <h2 data-i18n="pkg.h2">Tour Packages</h2>
      <p class="section-sub" data-i18n="pkg.p">Filter by type and pick what fits your time and comfort.</p>
    </div>
    <div class="filters reveal">
      <button class="chip is-active" data-filter="all" data-i18n="filter.all" type="button">All</button>
      <button class="chip" data-filter="nature" data-i18n="filter.nature" type="button">Nature</button>
      <button class="chip" data-filter="culture" data-i18n="filter.culture" type="button">Culture</button>
      <button class="chip" data-filter="adventure" data-i18n="filter.adventure" type="button">Adventure</button>
      <button class="chip" data-filter="family" data-i18n="filter.family" type="button">Family</button>
    </div>
    <div class="grid cards-3" id="pkgGrid"></div>
    <p class="muted tiny note-text" data-i18n="pkg.note">Prices are demo placeholders. Replace with your real pricing (USD / MNT).</p>
  </div>
</section>
