<section class="section" id="reviews">
  <div class="container">
    <div class="section-head reveal">
      <div class="section-label" data-i18n="rev.label">Traveler Stories</div>
      <h2 data-i18n="rev.h2">Client Reviews</h2>
      <p class="section-sub" data-i18n="rev.p">Feedback from travelers we helped in Mongolia.</p>
    </div>
    <div class="review-wrap reveal">
      <div class="review" id="reviewBox" aria-live="polite"></div>
      <div class="slider-actions">
        <button class="btn btn-ghost btn-small" id="prevReview" aria-label="Previous" type="button">←</button>
        <button class="btn btn-ghost btn-small" id="nextReview" aria-label="Next" type="button">→</button>
      </div>
    </div>
  </div>
</section>
